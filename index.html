<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گمشده‌ی شورا | مأموریت ویژه</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Vazirmatn -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0d0f1d',
                            card: '#16192e',
                            border: '#2a2f52',
                            accent: '#ffd166',
                            purple: '#7209b7',
                            pink: '#f72585',
                            blue: '#4cc9f0',
                            glow: '#3a0ca3'
                        }
                    },
                    boxShadow: {
                        'neon-yellow': '0 0 15px rgba(255, 209, 102, 0.4), 0 0 30px rgba(255, 209, 102, 0.1)',
                        'neon-purple': '0 0 20px rgba(114, 9, 183, 0.5), 0 0 40px rgba(114, 9, 183, 0.2)',
                        'card-glow': '0 8px 32px 0 rgba(0, 0, 0, 0.37)'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0b0d19;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(114, 9, 183, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(76, 201, 240, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(247, 37, 133, 0.08) 0%, transparent 60%);
            background-attachment: fixed;
            font-family: 'Vazirmatn', sans-serif;
            color: #f1f5f9;
        }

        .glass-card {
            background: rgba(22, 25, 46, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glow-text-yellow {
            text-shadow: 0 0 12px rgba(255, 209, 102, 0.6);
        }

        .glow-text-purple {
            text-shadow: 0 0 16px rgba(114, 9, 183, 0.8);
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.02); }
        }

        .pulse-glow {
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 overflow-x-hidden">

    <!-- Header / Brand -->
    <header class="w-full max-w-xl text-center my-4">
        <p class="text-xs sm:text-sm font-bold tracking-widest text-brand-blue uppercase mb-1">
            SCHOOL COUNCIL • SPECIAL CHALLENGE
        </p>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-brand-accent glow-text-yellow tracking-tight">
            گمشده‌ی شورا
        </h1>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-xl my-auto">
        
        <!-- Progress Bar Container -->
        <div id="progress-container" class="w-full mb-6 hidden">
            <div class="flex justify-between items-center text-xs font-semibold text-slate-400 mb-2">
                <span id="step-label">مرحله ۱ از ۳</span>
                <span id="progress-percent">33%</span>
            </div>
            <div class="w-full bg-slate-800/80 rounded-full h-2.5 p-0.5 border border-slate-700">
                <div id="progress-bar" class="bg-gradient-to-r from-brand-purple via-brand-pink to-brand-accent h-1.5 rounded-full transition-all duration-500 ease-out w-1/3"></div>
            </div>
        </div>

        <!-- STEP 0: START PAGE -->
        <div id="step-0" class="glass-card rounded-2xl p-6 sm:p-8 shadow-card-glow text-center border border-brand-border/60 fade-in relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-brand-purple/20 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="inline-flex items-center justify-center p-3 bg-brand-purple/20 border border-brand-purple/40 rounded-2xl mb-4 text-brand-accent">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>

            <h2 class="text-xl sm:text-2xl font-bold text-white mb-3">
                چهار مرحله، چند چالش و یک مأموریت متفاوت!
            </h2>
            
            <p class="text-sm sm:text-base text-slate-300 leading-relaxed mb-6">
                سلام به دانش‌آموزان پایه‌های <span class="text-brand-accent font-semibold">هفتم، هشتم و نهم</span>! آیا می‌توانی با هوش خود هویت کاندیدای اصلی شورا را رمزگشایی کنی؟
            </p>

            <div class="flex flex-wrap justify-center gap-2 mb-8">
                <span class="px-3 py-1 text-xs rounded-full bg-slate-800/90 text-slate-300 border border-slate-700">🧩 معما</span>
                <span class="px-3 py-1 text-xs rounded-full bg-slate-800/90 text-slate-300 border border-slate-700">💡 هوش</span>
                <span class="px-3 py-1 text-xs rounded-full bg-slate-800/90 text-slate-300 border border-slate-700">🎯 انتخاب</span>
                <span class="px-3 py-1 text-xs rounded-full bg-slate-800/90 text-slate-300 border border-slate-700">🎁 غافلگیری</span>
            </div>

            <button onclick
